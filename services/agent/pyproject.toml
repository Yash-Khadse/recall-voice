[project]
name = "recall-voice-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.16.2,<3", "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "langchain-ollama>=1,<2",
  "langchain-groq>=1,<2", "langchain-google-genai>=4,<5",
]
[project.optional-dependencies]
voice = ["livekit-agents[silero,groq,langchain,google]>=1.8,<2", "langgraph-checkpoint-postgres>=3,<4", "psycopg[binary,pool]>=3.2,<4"]
local-speech = ["faster-whisper>=1.1,<2"]
embeddings = ["sentence-transformers>=5,<6"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["voice_agent"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
