name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --frozen --extra voice
      - run: uv run ruff check voice_agent tests
      - run: uv run ruff format --check voice_agent tests
      - run: uv run pytest -q
      - run: uv run python -c "import voice_agent.worker"
      - run: uv export --frozen --no-dev --extra voice --format requirements-txt --no-emit-project > requirements-audit.txt
      - run: uvx pip-audit -r requirements-audit.txt
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.24.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results
          path: apps/web/test-results
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t recall-agent:verify services/agent
      - run: docker run --rm recall-agent:verify uv run --no-sync python -c "import voice_agent.worker"
