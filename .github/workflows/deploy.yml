name: Deploy verified main
# The web app deploys through Vercel's Git integration (root directory apps/web).
# This workflow deploys the LiveKit agent worker and smoke-tests the live site.
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # Deploying the agent is idempotent, so it always runs. This avoids the
      # skipped-deploy hole of diffing only the latest commit on multi-commit pushes.
      - uses: livekit/deploy-action@v2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ${{ secrets.LIVEKIT_SECRET_LIST }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: services/agent
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Smoke check
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: node scripts/smoke.mjs
