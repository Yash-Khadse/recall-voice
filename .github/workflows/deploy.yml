name: Deploy verified main
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Detect component changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -Eq '^(services/agent/|\.github/workflows/deploy.yml)'; then echo 'agent=true' >> "$GITHUB_OUTPUT"; fi
          if git diff --name-only HEAD~1 HEAD | grep -Eq '^(apps/web/|\.github/workflows/deploy.yml)'; then echo 'web=true' >> "$GITHUB_OUTPUT"; fi
      - uses: livekit/deploy-action@v2
        if: steps.changes.outputs.agent == 'true'
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ${{ secrets.LIVEKIT_SECRET_LIST }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: services/agent
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.web == 'true'
        with:
          node-version: '24'
      - name: Deploy Vercel project
        if: steps.changes.outputs.web == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@59.1.3 deploy apps/web --prod --yes --token "$VERCEL_TOKEN"
      - name: Smoke check
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: node scripts/smoke.mjs
